<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Skill Matches — SkillSwap</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside id="workspace-sidebar" class="sidebar"></aside>

      <div class="workspace-main">
        <header class="topbar">
          <div class="topbar-left">
            <button type="button" id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="Toggle navigation menu">☰</button>
            <div id="topbar-breadcrumb" class="breadcrumb">SkillSwap / Skill Matches</div>
          </div>
          <a href="/skills.html" class="btn btn-secondary btn-sm">Update My Skills</a>
        </header>

        <main class="page-content">
          <div class="page-intro">
            <div>
              <h1>Smart Mutual Skill Matches</h1>
              <p id="matches-summary">Analyzing complementary Teach and Learn interests across campus</p>
            </div>
          </div>

          <section class="match-graph-panel" aria-label="Mutual skill matching connection diagram">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
              <h2 style="font-size: 17px; color: #ffffff;">Bidirectional Match Map</h2>
              <span style="font-size: 12.5px; color: var(--text-on-dark-muted);">You Teach ↔ Peer Teaches</span>
            </div>
            <svg id="match-graph-svg" class="match-graph-svg" role="img" aria-label="Visual map of mutual skill connections"></svg>
          </section>

          <section id="matches-grid" class="match-cards-grid"></section>
        </main>
      </div>
    </div>

    <dialog id="request-dialog" class="ss-dialog">
      <div class="dialog-head">
        <h3>Send Exchange Request to <span id="req-peer-name"></span></h3>
        <button type="button" id="close-request-dialog" class="dialog-close" aria-label="Close modal">✕</button>
      </div>
      <div class="dialog-body">
        <div id="req-error" class="form-error hidden" style="margin-bottom: 14px;"></div>
        <form id="send-request-form" class="form-grid">
          <input type="hidden" id="req-receiver-id" />
          <div class="form-row-2">
            <div class="field">
              <label for="req-offered-skill">Skill You Will Teach</label>
              <select id="req-offered-skill" required></select>
            </div>
            <div class="field">
              <label for="req-requested-skill">Skill You Will Learn</label>
              <select id="req-requested-skill" required></select>
            </div>
          </div>
          <div class="field">
            <label for="req-message">Introduction & Proposed Format</label>
            <textarea id="req-message" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send Request</button>
        </form>
      </div>
    </dialog>

    <script type="module" src="/js/matching.js"></script>
  </body>
</html>
