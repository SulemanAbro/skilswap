<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Skills — SkillSwap</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside id="workspace-sidebar" class="sidebar"></aside>

      <div class="workspace-main">
        <header class="topbar">
          <div class="topbar-left">
            <button type="button" id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="Toggle navigation menu">☰</button>
            <div id="topbar-breadcrumb" class="breadcrumb">SkillSwap / Manage Skills</div>
          </div>
          <a href="/matches.html" class="btn btn-primary btn-sm">Check Mutual Matches</a>
        </header>

        <main class="page-content">
          <div class="page-intro">
            <div>
              <h1>Manage Your Skills</h1>
              <p>Keep your Teach and Learn lists accurate so SkillSwap finds complementary peers.</p>
            </div>
            <div class="segmented-bar" role="group" aria-label="Filter skills by type">
              <button type="button" class="segmented-btn active" data-skill-filter="All">All Skills</button>
              <button type="button" class="segmented-btn" data-skill-filter="Teach">Can Teach</button>
              <button type="button" class="segmented-btn" data-skill-filter="Learn">Want to Learn</button>
            </div>
          </div>

          <div class="workspace-grid-2">
            <div>
              <section id="teach-panel" class="panel" style="margin-bottom: 20px;">
                <div class="panel-head">
                  <h2>Skills I Can Teach</h2>
                </div>
                <ul id="teach-skills-list" class="skill-list"></ul>
              </section>

              <section id="learn-panel" class="panel">
                <div class="panel-head">
                  <h2>Skills I Want to Learn</h2>
                </div>
                <ul id="learn-skills-list" class="skill-list"></ul>
              </section>
            </div>

            <aside class="panel">
              <div class="panel-head">
                <h2>Add New Skill</h2>
              </div>
              <div id="add-skill-error" class="form-error hidden" style="margin-bottom: 14px;"></div>
              <form id="add-skill-form" class="form-grid">
                <div class="field">
                  <label for="skill-name">Skill Name</label>
                  <input type="text" id="skill-name" placeholder="e.g., Python Programming, UI/UX Design" required />
                </div>
                <div class="field">
                  <label for="skill-type">Skill Category</label>
                  <select id="skill-type" required>
                    <option value="Teach">Skills I Can Teach</option>
                    <option value="Learn">Skills I Want to Learn</option>
                  </select>
                </div>
                <div class="field">
                  <label for="skill-level">Proficiency / Target Level</label>
                  <select id="skill-level" required>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate" selected>Intermediate</option>
                    <option value="Advanced">Advanced</option>
                  </select>
                </div>
                <div class="field">
                  <label for="skill-desc">Topics & Scope</label>
                  <textarea id="skill-desc" placeholder="Describe the tools, topics, or project goals you want to cover."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Add Skill</button>
              </form>
            </aside>
          </div>
        </main>
      </div>
    </div>

    <dialog id="edit-skill-dialog" class="ss-dialog">
      <div class="dialog-head">
        <h3>Edit Skill</h3>
        <button type="button" id="close-skill-dialog" class="dialog-close" aria-label="Close modal">✕</button>
      </div>
      <div class="dialog-body">
        <form id="edit-skill-form" class="form-grid">
          <input type="hidden" id="edit-skill-id" />
          <div class="field">
            <label for="edit-skill-name">Skill Name</label>
            <input type="text" id="edit-skill-name" required />
          </div>
          <div class="form-row-2">
            <div class="field">
              <label for="edit-skill-type">Category</label>
              <select id="edit-skill-type" required>
                <option value="Teach">Teach</option>
                <option value="Learn">Learn</option>
              </select>
            </div>
            <div class="field">
              <label for="edit-skill-level">Level</label>
              <select id="edit-skill-level" required>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="edit-skill-desc">Description</label>
            <textarea id="edit-skill-desc"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>
    </dialog>

    <script type="module" src="/js/skills.js"></script>
  </body>
</html>
